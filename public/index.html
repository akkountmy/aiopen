<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#151517" />
    <title>DSH Open</title>
    <link rel="icon" href="/favicon.svg?v=__ASSET_VERSION__" type="image/svg+xml" />
    <!-- Ярлык на домашнем экране iOS и Android берут только из PNG: SVG они не
         ставят, и без этих файлов ярлык получался пустым белым квадратом. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=__ASSET_VERSION__" />
    <link rel="mask-icon" href="/favicon.svg?v=__ASSET_VERSION__" color="#848683" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DSH Open" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script src="/theme.js?v=__ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/styles.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <div id="boot" class="boot">
      <img class="boot-mark" src="/favicon.svg" alt="" width="34" height="34" />
      <div class="boot-bar"><span></span></div>
      <!-- Сервис не ответил (обновили, перезапуск, пропала связь): это не выход
           из аккаунта, поэтому предлагаем повторить, а не вводить пароль. -->
      <div id="bootNote" class="boot-note hidden" role="status" aria-live="polite">
        <p id="bootNoteText">Сервис не отвечает. Вход сохранён — повторять его не нужно.</p>
        <button id="bootRetry" class="btn btn-primary" type="button">Повторить</button>
      </div>
    </div>

    <section id="auth" class="auth hidden" aria-label="Вход">
      <div class="auth-card">
        <!-- Та же кнопка темы, что и в шапке рабочего окна: иначе человек,
             открывший сервис в неподходящей теме, не может её сменить до входа. -->
        <button id="authThemeToggle" class="btn btn-ghost btn-icon theme-toggle auth-theme" type="button" title="Светлая тема" aria-label="Переключить тему">
          <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 11.5A6.5 6.5 0 018.5 4a6.5 6.5 0 107.5 7.5z" /></svg>
          <svg class="icon-sun hidden" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" /><path d="M10 2v1.8M10 16.2V18M2 10h1.8M16.2 10H18M4.3 4.3l1.3 1.3M14.4 14.4l1.3 1.3M15.7 4.3l-1.3 1.3M5.6 14.4l-1.3 1.3" /></svg>
        </button>
        <div class="auth-mark" aria-hidden="true">
          <svg class="whale" viewBox="0 0 24 24"><path d="M23.748 4.651c-.254-.124-.364.113-.512.233-.051.04-.094.09-.137.137-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.155-.708-.311-.955-.65-.172-.24-.219-.509-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.094.172.187.129.323-.082.28-.18.553-.266.833-.055.179-.137.218-.328.14a5.5 5.5 0 0 1-1.737-1.179c-.857-.828-1.631-1.743-2.597-2.46a12 12 0 0 0-.689-.47c-.985-.957.13-1.743.387-1.836.27-.098.094-.433-.778-.428-.872.003-1.67.295-2.687.685a3 3 0 0 1-.465.136 9.6 9.6 0 0 0-2.883-.101c-1.885.21-3.39 1.1-4.497 2.622C.082 8.776-.231 10.854.152 13.02c.403 2.284 1.568 4.175 3.36 5.653 1.857 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.132-.284 4.994-1.86.47.234.962.328 1.78.398.629.058 1.235-.031 1.705-.129.735-.155.684-.836.418-.961-2.155-1.004-1.682-.595-2.112-.926 1.095-1.295 2.768-3.598 3.284-6.733.05-.346.115-.834.108-1.114-.004-.171.035-.238.23-.257a4.2 4.2 0 0 0 1.545-.475c1.397-.763 1.96-2.016 2.093-3.517.02-.23-.004-.467-.247-.588M11.58 18.168c-2.088-1.642-3.101-2.183-3.52-2.16-.39.024-.32.472-.234.763.09.288.207.487.371.74.114.167.192.416-.113.603-.673.416-1.842-.14-1.897-.168-1.361-.801-2.5-1.86-3.301-3.306-.775-1.393-1.225-2.888-1.299-4.482-.02-.385.094-.522.477-.592a4.7 4.7 0 0 1 1.53-.038c2.131.311 3.946 1.264 5.467 2.774.868.86 1.525 1.887 2.202 2.89.72 1.066 1.494 2.082 2.48 2.915.348.291.626.513.892.677-.802.09-2.14.109-3.055-.615zm1.001-6.44a.306.306 0 0 1 .415-.287.3.3 0 0 1 .113.074.3.3 0 0 1 .086.214c0 .17-.136.307-.308.307a.303.303 0 0 1-.306-.307m3.11 1.596c-.2.081-.4.151-.591.16a1.25 1.25 0 0 1-.798-.254c-.274-.23-.47-.358-.551-.758a1.7 1.7 0 0 1 .015-.588c.07-.327-.007-.537-.238-.727-.188-.156-.426-.199-.689-.199a.6.6 0 0 1-.254-.078.253.253 0 0 1-.114-.358 1 1 0 0 1 .192-.21c.356-.202.767-.136 1.146.016.352.144.618.408 1.001.782.392.451.462.576.685.915.176.264.336.536.446.848.066.194-.02.353-.25.45" /></svg>
        </div>
        <form id="loginForm" autocomplete="on" novalidate>
          <label class="field">
            <span class="field-label">Логин</span>
            <input id="loginUser" type="text" name="username" autocomplete="username" spellcheck="false" required />
          </label>
          <label class="field">
            <span class="field-label">Пароль</span>
            <input id="loginPass" type="password" name="password" autocomplete="current-password" required />
          </label>
          <p id="loginError" class="field-error" role="alert"></p>
          <button id="loginSubmit" class="btn btn-primary btn-block" type="submit">Войти</button>
          <p id="authAlt" class="auth-alt hidden">
            Нет аккаунта?
            <button id="authSwitchToSignup" class="auth-link" type="button">Создать</button>
          </p>
        </form>
        <form id="signupForm" class="hidden" autocomplete="on" novalidate>
          <label class="field">
            <span class="field-label">Логин</span>
            <input id="signupUser" type="text" name="username" autocomplete="username" spellcheck="false" required />
          </label>
          <label class="field">
            <span class="field-label">Пароль</span>
            <input id="signupPass" type="password" name="password" autocomplete="new-password" required />
          </label>
          <label class="field">
            <span class="field-label">Пароль ещё раз</span>
            <input id="signupPass2" type="password" name="password2" autocomplete="new-password" required />
          </label>
          <p id="signupError" class="field-error" role="alert"></p>
          <button id="signupSubmit" class="btn btn-primary btn-block" type="submit">Создать аккаунт</button>
          <p class="auth-alt">
            Уже есть аккаунт?
            <button id="authSwitchToLogin" class="auth-link" type="button">Войти</button>
          </p>
        </form>
      </div>
    </section>

    <div id="app" class="app hidden">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-actions sidebar-actions-first">
            <!-- Иконка — та же, что у кнопки «добавить рабочую область» в
                 Harness: контур папки, а в правом верхнем углу знак «+».
                 Старая папка с крупным плюсом внутри убрана. -->
            <button id="newProjectBtn" class="btn btn-ghost btn-new" type="button" title="Новый проект">
              <svg class="ico-solid" viewBox="0 0 16 16" aria-hidden="true"><path transform="translate(9.52 2.52)" d="M3.55246 0L3.55246 2.44252L6 2.44252L6 3.55748L3.55246 3.55748L3.55246 6L2.43834 6L2.43834 3.55748L0 3.55748L0 2.44252L2.43834 2.44252L2.43834 0L3.55246 0Z" /><path transform="translate(0.3496 2.35)" d="M4.76367 0C5.36861 1.80598e-05 5.93113 0.310294 6.25488 0.821289L6.78027 1.64941C6.79685 1.67558 6.81791 1.69775 6.83887 1.71973C6.72186 2.15521 6.65702 2.61192 6.65137 3.08301C6.25601 2.96045 5.90909 2.70478 5.68164 2.3457L5.15723 1.5166C5.07183 1.38189 4.92318 1.3008 4.76367 1.30078L2.32422 1.30078C1.7589 1.30078 1.30078 1.7589 1.30078 2.32422L1.30078 10.1338C1.30078 10.6991 1.7589 11.1572 2.32422 11.1572L11.9766 11.1572C12.5419 11.1572 13 10.6991 13 10.1338L13 8.58398C13.4545 8.5135 13.8903 8.38748 14.3008 8.21289L14.3008 10.1338C14.3008 11.4171 13.2598 12.458 11.9766 12.458L2.32422 12.458C1.04093 12.458 0 11.4171 0 10.1338L0 2.32422C0 1.04093 1.04093 0 2.32422 0L4.76367 0Z" /></svg>
              <span>Новый проект</span>
            </button>
          </div>
        </div>

        <nav id="projectList" class="project-list" aria-label="Проекты"></nav>
        <div id="sidebarResizer" class="resizer resizer-sidebar" role="separator" aria-orientation="vertical" tabindex="0"></div>
      </aside>

      <main class="main">
        <header class="topbar" id="topbar">
          <div class="topbar-left">
            <button id="sidebarToggle" class="btn btn-ghost btn-icon mobile-only" type="button" title="Меню" aria-label="Меню">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" /></svg>
            </button>
            <div class="crumbs">
              <span id="crumbChat" class="crumb-chat"></span>
            </div>
          </div>
          <div class="topbar-right">
            <span id="balanceChip" class="balance-chip hidden" aria-label="Баланс"></span>
            <button id="userChip" class="user-chip user-chip-top" type="button" title="Учётная запись">
              <svg class="account-glyph" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3.2" /><path d="M4.5 16.2c.9-2.7 3-4.2 5.5-4.2s4.6 1.5 5.5 4.2" /></svg>
              <span class="user-meta">
                <span id="userName" class="user-name"></span>
              </span>
              <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4" /></svg>
            </button>
            <button id="themeToggle" class="btn btn-ghost btn-icon theme-toggle" type="button" title="Светлая тема" aria-label="Переключить тему">
              <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 11.5A6.5 6.5 0 018.5 4a6.5 6.5 0 107.5 7.5z" /></svg>
              <svg class="icon-sun hidden" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" /><path d="M10 2v1.8M10 16.2V18M2 10h1.8M16.2 10H18M4.3 4.3l1.3 1.3M14.4 14.4l1.3 1.3M15.7 4.3l-1.3 1.3M5.6 14.4l-1.3 1.3" /></svg>
            </button>
            <!-- Панель «Файлы проекта» открыта всегда, поэтому значка папки на
                 большом экране нет: кнопка нужна только до 1100 px, где панель
                 становится выезжающим ящиком. -->
            <button id="filesBtn" class="btn btn-ghost btn-icon files-toggle" type="button" title="Файлы проекта" aria-label="Файлы проекта">
              <svg class="ico-solid" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.19629 1.57104C5.81144 1.5711 6.38623 1.8786 6.72754 2.39038L7.19922 3.09839C7.28454 3.22635 7.42824 3.30344 7.58203 3.30347H12.1699C13.5039 3.30348 14.5859 4.38548 14.5859 5.71948V6.62671C15.2694 7.02689 15.6605 7.85012 15.4385 8.68726L14.3848 12.658C14.1037 13.7164 13.1449 14.4527 12.0498 14.4529H2.91699C1.51651 14.4529 0.451662 13.2814 0.501954 11.9519V3.98706C0.501954 2.65305 1.58396 1.57104 2.91797 1.57104H5.19629ZM3.7793 7.75562C3.30994 7.75562 2.89883 8.07153 2.77832 8.52515L1.91602 11.7722C1.74167 12.4291 2.23734 13.073 2.91699 13.073H12.0498C12.5191 13.0728 12.9304 12.757 13.0508 12.3035L14.1045 8.33374C14.1819 8.04202 13.9619 7.756 13.6602 7.75562H3.7793ZM2.91797 2.9519C2.34625 2.9519 1.88281 3.41534 1.88281 3.98706V7.2937C2.33068 6.7269 3.02249 6.37476 3.7793 6.37476H13.2051V5.71948C13.2051 5.14777 12.7416 4.68434 12.1699 4.68433H7.58203C6.96675 4.6843 6.39209 4.37595 6.05078 3.86401L5.5791 3.15601C5.49379 3.02821 5.34995 2.95196 5.19629 2.9519H2.91797Z" /></svg>
            </button>
          </div>
        </header>

        <div class="scroll" id="scroll">
          <div class="thread" id="thread"></div>
        </div>

        <div class="composer-wrap">
          <form id="composer" class="composer" autocomplete="off">
            <div id="attachStrip" class="attach-strip hidden"></div>
            <div class="composer-row">
              <button id="attachBtn" class="btn btn-ghost attach-btn" type="button" title="Прикрепить файлы (фото, документы, таблицы)" aria-label="Прикрепить файлы">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 1 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5" /></svg>
              </button>
              <div id="dictationBar" class="dictation-bar hidden" title="Нажмите микрофон, чтобы закончить запись">
                <span class="dictation-dot" aria-hidden="true"></span>
                <span id="dictationText" class="dictation-text">Слушаю…</span>
                <button id="dictationCancel" class="dictation-cancel" type="button">Отменить</button>
              </div>
              <textarea id="input" rows="1" placeholder="Спросите или поставьте задачу…" aria-label="Сообщение" spellcheck="true" lang="ru" autocapitalize="sentences"></textarea>
              <button id="spellBtn" class="btn btn-ghost btn-icon tool-btn" type="button" title="Проверить орфографию" aria-label="Проверить орфографию">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5l3.6-9 3.6 9M4.5 13.3h4.2" /><path d="M12.6 12.6l1.9 1.9 3.1-4.3" /></svg>
              </button>
              <button id="micBtn" class="btn btn-ghost btn-icon tool-btn" type="button" title="Голосовой ввод" aria-label="Голосовой ввод" aria-pressed="false">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7.1" y="2.6" width="5.8" height="9.2" rx="2.9" /><path d="M4.4 9.6a5.6 5.6 0 0011.2 0M10 15.2v2.4" /></svg>
              </button>
              <button id="sendBtn" class="btn btn-send" type="submit" title="Отправить" aria-label="Отправить">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10l12-6-4.5 12-2-4.5L4 10z" /></svg>
              </button>
              <button id="stopBtn" class="btn btn-stop hidden" type="button" title="Остановить" aria-label="Остановить">
                <span></span>
              </button>
            </div>
            <input id="fileInput" type="file" multiple hidden />
          </form>
          <p class="composer-hint">Enter — отправить · Shift+Enter — новая строка · микрофон — голосовой ввод</p>
        </div>
        <!-- Подсказка одна на всю область ответа: файл можно отпустить где угодно
             в диалоге, не только над полем ввода. -->
        <div id="dropHint" class="drop-hint" aria-hidden="true">Отпустите файлы, чтобы прикрепить к сообщению</div>
      </main>

      <aside id="filesPanel" class="files-panel" aria-label="Файлы проекта">
        <div id="filesResizer" class="resizer resizer-files" role="separator" aria-orientation="vertical" tabindex="0"></div>
        <div class="files-head">
          <!-- Заголовок панели — кнопка выбора проекта: такой же блок, как кнопка
               «Новый проект» слева, только с шевроном. Нажатие раскрывает список
               проектов, и в панели появляются файлы выбранного проекта. -->
          <button id="filesProjectBtn" class="files-title" type="button" title="Выбрать проект, чьи файлы показывать" aria-haspopup="menu" aria-expanded="false">
            <!-- Иконка — раскрытая папка из того же набора Harness, что и кнопка
                 «Новый проект»: та же сетка 16 и та же толщина контура. -->
            <svg class="ico-solid" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.19629 1.57104C5.81144 1.5711 6.38623 1.8786 6.72754 2.39038L7.19922 3.09839C7.28454 3.22635 7.42824 3.30344 7.58203 3.30347H12.1699C13.5039 3.30348 14.5859 4.38548 14.5859 5.71948V6.62671C15.2694 7.02689 15.6605 7.85012 15.4385 8.68726L14.3848 12.658C14.1037 13.7164 13.1449 14.4527 12.0498 14.4529H2.91699C1.51651 14.4529 0.451662 13.2814 0.501954 11.9519V3.98706C0.501954 2.65305 1.58396 1.57104 2.91797 1.57104H5.19629ZM3.7793 7.75562C3.30994 7.75562 2.89883 8.07153 2.77832 8.52515L1.91602 11.7722C1.74167 12.4291 2.23734 13.073 2.91699 13.073H12.0498C12.5191 13.0728 12.9304 12.757 13.0508 12.3035L14.1045 8.33374C14.1819 8.04202 13.9619 7.756 13.6602 7.75562H3.7793ZM2.91797 2.9519C2.34625 2.9519 1.88281 3.41534 1.88281 3.98706V7.2937C2.33068 6.7269 3.02249 6.37476 3.7793 6.37476H13.2051V5.71948C13.2051 5.14777 12.7416 4.68434 12.1699 4.68433H7.58203C6.96675 4.6843 6.39209 4.37595 6.05078 3.86401L5.5791 3.15601C5.49379 3.02821 5.34995 2.95196 5.19629 2.9519H2.91797Z" /></svg>
            <span id="filesProjectName">Файлы проекта</span>
            <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4" /></svg>
          </button>
        </div>
        <div id="filesCrumb" class="files-crumb"></div>
        <div id="filesNote" class="files-note hidden" aria-live="polite"></div>
        <div class="files-actions">
          <button id="filesUploadBtn" class="btn files-upload" type="button" title="Загрузить файлы в папку проекта">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V4M5.5 8.5L10 4l4.5 4.5" /></svg>
            <span id="filesUploadLabel">Загрузить файлы</span>
          </button>
          <span class="files-drop-note">или перетащите файлы с компьютера</span>
        </div>
        <div id="filesList" class="files-list"></div>
        <div id="filesDropHint" class="files-drop-hint" aria-hidden="true">Отпустите, чтобы добавить в проект</div>
      </aside>
      <div id="backdrop" class="backdrop" aria-hidden="true"></div>
    </div>

    <div id="modalRoot" class="modal-root hidden"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
    <input id="filesPanelInput" type="file" multiple hidden />

    <script type="module" src="/app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
